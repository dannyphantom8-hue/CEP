<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roots of Mumbai - Mangrove Awareness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12261f;--bg:#e9eee7;--panel:#f7f9f5;--tide:#2d7c78;--water:#4aa6a0;--mud:#5b4a3a;--line:#c3cfc0;--accent:#c9871f;
--head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Serif 4",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e3ece4;--bg:#0f1c18;--panel:#162a24;--tide:#5fc0b9;--water:#2f8f89;--mud:#a68c72;--line:#2b443c;--accent:#e2a63f}}
:root[data-theme="dark"]{--ink:#e3ece4;--bg:#0f1c18;--panel:#162a24;--tide:#5fc0b9;--water:#2f8f89;--mud:#a68c72;--line:#2b443c;--accent:#e2a63f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 var(--body)}
a{color:var(--tide)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:16px 0;font-family:var(--head);font-weight:500}
nav b{margin-right:auto;font-weight:800;font-size:1.1rem}nav a{text-decoration:none;color:var(--ink)}nav a:hover{color:var(--tide)}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;letter-spacing:-.02em;max-width:14ch}
h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700}h3{font-size:1.2rem;font-weight:700}
.hero{padding:28px 0 12px}.lead{max-width:56ch;font-size:1.15rem}
.tide{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:24px}
.tide svg{width:100%;height:auto;display:block;border-radius:8px}
.tide label{display:flex;gap:14px;align-items:center;font-family:var(--head);font-weight:500;margin-top:12px}
.tide input{flex:1;accent-color:var(--tide);min-width:0}
#cap{margin:8px 0 0;min-height:3.4em;font-size:1rem}
section{padding:56px 0 8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.cols p{margin:0}
.threats{border-left:4px solid var(--accent);padding-left:18px;max-width:62ch}
.threats li{margin:.4em 0}
.spot{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
.spot th,.spot td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.spot th{font-family:var(--head);white-space:nowrap}
.act{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.act label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.act input{margin-top:.5em;accent-color:var(--tide);width:18px;height:18px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--tide);transition:width .3s}
button,.btn{font:600 1rem var(--head);background:var(--tide);color:#fff;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;text-decoration:none;display:inline-block}
:root[data-theme="dark"] button,:root:not([data-theme="light"]) button{color:#0f1c18}
form{display:grid;gap:12px;max-width:460px;margin-top:16px}
input[type=text],input[type=email],select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
#msg{font-family:var(--head);font-weight:500;min-height:1.5em}
footer{margin-top:64px;padding:28px 0 40px;border-top:1px solid var(--line);font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{padding:6px 12px;font-size:.9rem;background:transparent;color:var(--ink)!important;border:1px solid var(--line)}
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:28px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.facts b{display:block;font:800 1.5rem var(--head);color:var(--tide)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tide);border-radius:12px;padding:18px;transition:transform .2s}
.card:hover{transform:translateY(-4px)}.card p{margin:0;font-size:1rem}
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:640px}
.quiz .opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--ink)!important;border:1px solid var(--line)}
